    const { data, error } = await c.from('notes').select('*').order('pinned', { ascending: false }).order('updated_at', { ascending: false }).limit(500);
    if (error) throw error;

  async addNote(cfg, body) {

    const { error } = await c.from('notes').update({ ...fields, updated_at: nowISO() }).eq('id', id);

    const { error } = await c.from('notes').delete().eq('id', id);

  // ── ไฟล์แนบของโน้ต (bucket ส่วนตัว 'note-attachments' — ดู supabase/add_note_attachments.sql) ──
  async uploadNoteAttachment(cfg, userId, noteId, file) {

      .upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });

  async deleteNoteAttachment(cfg, path) {
    const c = getSb(cfg); if (!c) return;
    await c.storage.from('note-attachments').remove([path]).catch(() => {});
  },
};

// สร้างสรุปข้อมูลงาน (context) ส่งให้ AI — จำกัดจำนวนเพื่อคุม token
function buildChatContext(tasks, currentUser, isManager) {
  const scope = isManager ? tasks : (tasks || []).filter(t => t.assignee === currentUser);
  const today = nowISO().slice(0, 10);
  const total = scope.length;
  const done  = scope.filter(t => t.status === 'done').length;
  const lines = scope.slice(0, 40).map(t =>
    `- [${t.status}] ${t.title} | ผู้รับผิดชอบ: ${t.assignee} | หมวด: ${t.category} | ความสำคัญ: ${t.priority} | กำหนด: ${t.deadline || '-'}`
  );
  return `วันนี้: ${today}\nขอบเขต: ${isManager ? 'ทั้งทีม' : currentUser}\nงานทั้งหมด: ${total} (เสร็จแล้ว ${done})\nรายการงาน:\n${lines.join('\n')}`;
}

function rowClass(deadline, status) {
  if (status === 'done') return '';
  const d = daysDiff(deadline);
  if (d < 0) return 'row-overdue';
  if (d <= 3) return 'row-soon';
  return '';
}

// ─── Shared components ────────────────────────────────────────────────────────

function Avatar({ name, size }) {
  const cls = ['avatar', size === 'lg' ? 'avatar-lg' : size === 'sm' ? 'avatar-sm' : ''].filter(Boolean).join(' ');
  return <div className={cls} style={{ background: getUserColor(name) }}>{initials(name)}</div>;
}

function StatusBadge({ status }) {
  const { lang } = useT();
  return <span className={`badge badge-${status}`}>{tStatus(status, lang)}</span>;
}

function PriorityBadge({ priority }) {
  const { lang } = useT();
  return <span className={`badge badge-${priority}`}>{tPriority(priority, lang)}</span>;
}

function Countdown({ deadline, status }) {
  const { t } = useT();
  if (status === 'done') return <span className="countdown-green">{t('cd_done')}</span>;
  const d = daysDiff(deadline);
  if (d < 0)  return <span className="countdown-red">{t('cd_over', { n: Math.abs(d) })}</span>;
  if (d === 0) return <span className="countdown-amber">{t('cd_today')}</span>;
  if (d <= 3)  return <span className="countdown-amber">{t('cd_in', { n: d })}</span>;
  return <span className="countdown-blue">{t('cd_in', { n: d })}</span>;
}

// ─── TaskModal ────────────────────────────────────────────────────────────────

function TaskModal({ task, currentUser, onClose, onUpdate }) {
  const { t, lang } = useT();
  const [commentText, setCommentText] = useState('');
  const [localStatus, setLocalStatus] = useState(task.status);
  const [localDesc, setLocalDesc]     = useState(task.description || '');

  const isManager  = currentUser === 'Big Boss';
  const isAssignee = currentUser === task.assignee;
  const canStatus  = isManager || isAssignee;

  function updateTask(patch) {
    const updated = { ...task, ...patch };
    onUpdate(updated);
  }

  function handleStatus(e) {
    const s = e.target.value;
    setLocalStatus(s);
    updateTask({ status: s });
  }

  function handleDescBlur() {
    if (isManager && localDesc !== task.description) updateTask({ description: localDesc });
  }

  function sendComment() {
    if (!commentText.trim()) return;
    const c = { id: uid(), author: currentUser, text: commentText.trim(), createdAt: nowISO() };
    updateTask({ comments: [...(task.comments || []), c] });
    setCommentText('');
  }

  return (
    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-header">
          <div className="modal-title">{task.title}</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">

          {/* Details section */}
          <div className="modal-section">
            <div className="modal-section-title">{t('task_info')}</div>
            <div className="detail-grid">
              <div className="detail-item">
                <label>{t('th_assignee')}</label>
                <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:4 }}>
                  <Avatar name={task.assignee} size="sm" />
                  <span>{task.assignee}</span>
                </div>
              </div>
              <div className="detail-item">
                <label>{t('f_category')}</label>
                <span>{tCat(task.category, lang)}</span>
              </div>
              <div className="detail-item">
                <label>{t('th_priority')}</label>
                <div style={{ marginTop:4 }}><PriorityBadge priority={task.priority} /></div>
              </div>
              <div className="detail-item">
                <label>{t('th_deadline')}</label>
                <span>{formatDate(task.deadline, lang)}</span>
              </div>
              <div className="detail-item" style={{ gridColumn:'1 / -1' }}>
                <label>{t('th_status')}</label>
                {canStatus ? (
                  <select className="form-select" style={{ marginTop:4, width:'auto', minWidth:200 }} value={localStatus} onChange={handleStatus}>
                    {STATUSES.map(s => <option key={s} value={s}>{tStatus(s, lang)}</option>)}
                  </select>
                ) : (
                  <div style={{ marginTop:4 }}><StatusBadge status={task.status} /></div>
                )}
              </div>
              <div className="detail-item">
                <label>{t('created_by')}</label>
                <span>{task.createdBy}</span>
              </div>
              <div className="detail-item">
                <label>{t('created_at')}</label>
                <span>{formatDateTime(task.createdAt, lang)}</span>
              </div>
            </div>
          </div>

          <div className="section-divider" />

          {/* Description */}
          <div className="modal-section">
            <div className="modal-section-title">{t('task_desc')}</div>
            {isManager ? (
              <textarea
                className="form-textarea"
                rows={3}
                value={localDesc}
                onChange={e => setLocalDesc(e.target.value)}
                onBlur={handleDescBlur}
                placeholder={t('add_desc_ph')}
              />
            ) : (
              <p style={{ fontSize:'0.88rem', lineHeight:1.65, color: task.description ? 'var(--text)' : 'var(--text-muted)' }}>
                {task.description || t('no_desc')}
              </p>
            )}
          </div>

          <div className="section-divider" />

          {/* Comments */}
          <div className="modal-section" style={{ marginBottom:0 }}>
            <div className="modal-section-title">{t('notes')} ({(task.comments||[]).length})</div>
            {(task.comments || []).length === 0 ? (
              <p style={{ fontSize:'0.82rem', color:'var(--text-muted)', marginBottom:14 }}>{t('no_notes')}</p>
            ) : (
              <div className="comment-list">
                {(task.comments || []).map(c => (
                  <div key={c.id} className="comment-item">
                    <Avatar name={c.author} size="sm" />
                    <div className="comment-body">
                      <div className="comment-meta">
                        <span className="comment-author">{c.author}</span>
                        <span className="comment-time">{formatDateTime(c.createdAt, lang)}</span>
                      </div>
                      <div className="comment-text">{c.text}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
            <div className="comment-input-row">
              <textarea
                className="form-textarea comment-textarea"
                placeholder={t('note_ph')}
                value={commentText}
                onChange={e => setCommentText(e.target.value)}
                onKeyDown={e => { if (e.ctrlKey && e.key === 'Enter') sendComment(); }}
              />
              <button className="btn btn-primary" onClick={sendComment}>{t('send')}</button>
            </div>
          </div>

        </div>
      </div>
    </div>
  );
}

// ─── Mabelz Recommendation Engine ────────────────────────────────────────────

function mabelzRecommend(title, description, category, tasks, lang) {
  const en = lang === 'en';
  const text = (title + ' ' + description).toLowerCase();
  const ACTIVE = ['pending', 'in_progress', 'review'];

  const scores = { 'Ple': 0, 'Pang': 0, 'Nam': 0, 'Issan': 0 };

  // 1) คีย์เวิร์ดของแต่ละคน (ตามหน้าที่จริง) — weight 3
  const personKw = {
    'Ple': ['รับเงิน','รับชำระ','ใบเสร็จ','ใบกำกับ','ใบกำกับภาษี','ar','gift card','line gift','amaze','คอมมิช','ค่าคอม','คอมมิชชั่น','ร้านค้าชำระ','ร้านชำระ'],
    'Pang':     ['จ่าย','ทำจ่าย','ค่าใช้จ่าย','supplier','ซัพพลายเออร์','ap','ภาษีซื้อ','ภาษีขาย','ภ.พ','ภ.ง.ด','vat','นำส่งภาษี','ยื่นภาษี','ยื่นแบบ','สรรพากร','withholding','หัก ณ ที่จ่าย','pnd'],
    'Nam':      ['vendor','เปิด vendor','ผู้ขายรายใหม่','เจ้าใหม่','เปลี่ยนที่อยู่','ที่อยู่','เอกสาร','กรอกข้อมูล','กรอกเอกสาร','admin','ข้อสงสัย','สอบถาม'],
    'Issan':      ['สิงคโปร','มาเลเซีย','singapore','malaysia','sgd','myr',' sg ',' my ','ต่างประเทศ','overseas'],
  };
  Object.entries(personKw).forEach(([p, kws]) => kws.forEach(kw => { if (text.includes(kw)) scores[p] += 3; }));

  // 2) region override — งาน SG/MY ให้Issanเด่นชัด (weight 6)
  if (/singapore|malaysia|สิงคโปร|มาเลเซีย|sgd|myr/.test(text)) scores['Issan'] += 6;

  // มั่นใจไหม? = มี keyword/region จับคู่จริง (ถ้าไม่มี = เดาจาก workload เฉย ๆ — ไม่ควร force ผู้รับผิดชอบ)
  const confident = Math.max(scores['Ple'], scores['Pang'], scores['Nam'], scores['Issan']) > 0;

  // 3) Workload penalty (งานในมือน้อย = ได้เปรียบ)
  ASSIGNEES.forEach(name => {
    const active = tasks.filter(t => t.assignee === name && ACTIVE.includes(t.status)).length;
    scores[name] -= active * 1.5;
  });
  scores['Issan'] -= 1; // เพิ่งเข้า กำลังเทรน — ลดภาระเล็กน้อย

  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const name   = sorted[0][0];

  // 4) แนะนำหมวดจาก keyword
  const catKw = {
    'ภาษี':        ['ภาษี','vat','ภ.พ','ภ.ง.ด','สรรพากร','withholding','หัก ณ ที่จ่าย','นำส่งภาษี','pnd'],
    'Gift Card':   ['gift card','line gift','amaze','บัตรของขวัญ'],
    'AR':          ['รับเงิน','รับชำระ','ใบเสร็จ','ใบกำกับ'],
    'AP':          ['จ่าย','ค่าใช้จ่าย','supplier','ซัพพลายเออร์'],
    'Admin':       ['vendor','ที่อยู่','เอกสาร','กรอก'],
    'ลูกค้า/Line': ['line official','line','อีเมล','ตอบ','สอบถาม','คอมมิช'],
  };
  let suggestedCat = null, bestCat = 0;
  Object.entries(catKw).forEach(([c, kws]) => {
    const hit = kws.filter(kw => text.includes(kw)).length;
    if (hit > bestCat) { bestCat = hit; suggestedCat = c; }
  });
  if (!suggestedCat) suggestedCat = ASSIGNEE_CATEGORY[name] || category;

  // 5) เหตุผล / reasons
  const reasons = [];
  const matched = (personKw[name] || []).filter(kw => text.includes(kw));
  const roleTxt = tRole(USERS.find(u => u.name === name)?.role || '', lang);
  if (matched.length) reasons.push(en ? `Keywords found: ${matched.slice(0, 3).join(', ')}` : `คีย์เวิร์ดที่พบ: ${matched.slice(0, 3).join(', ')}`);
  reasons.push(en ? `Handles ${roleTxt}` : `ดูแล ${roleTxt}`);
  const activeCount = tasks.filter(t => t.assignee === name && ACTIVE.includes(t.status)).length;
  reasons.push(en ? `${activeCount} active task(s) on hand` : `งานในมืออยู่ ${activeCount} งาน`);
  if (name === 'Issan') reasons.push(en ? '⚠️ New team member in training — needs a mentor to review' : '⚠️ เพิ่งเข้าทีม กำลังเทรน — ควรมีพี่เลี้ยงช่วยตรวจ');
  if (suggestedCat === 'ภาษี') reasons.push(en ? '🔴 Tax task — set status to "In Review" before closing' : '🔴 งานภาษี ควรตั้งสถานะ "รอตรวจสอบ" ก่อนปิดงาน');

  return {
    recommended: name,
    runner: sorted[1] ? sorted[1][0] : null,
    reasons,
    category: suggestedCat,
    confident,
    aiBuddy: USERS.find(u => u.name === name)?.ai || null,
  };
}

// ─── CreateTaskModal ──────────────────────────────────────────────────────────

function CreateTaskModal({ onClose, onSave, currentUser, initialTask, tasks, selfOnly, prefill, limitedEdit }) {
  const editing = !!initialTask;
  const [form, setForm] = useState(
    editing
      ? { title: initialTask.title, description: initialTask.description || '', assignee: initialTask.assignee, category: initialTask.category, priority: initialTask.priority, deadline: initialTask.deadline, status: initialTask.status, recurrence: initialTask.recurrence || 'none' }
      : { title: (prefill && prefill.title) || '', description: (prefill && prefill.description) || '', assignee: (prefill && prefill.assignee != null) ? prefill.assignee : (selfOnly ? currentUser : ''), category: (prefill && prefill.category) || 'AR', priority: (prefill && prefill.priority) || 'medium', deadline: '', status: 'pending', recurrence: (prefill && prefill.recurrence) || 'none' }
  );
  const [mabelzTip, setMabelzTip] = React.useState(null);
  const [thinking, setThinking]   = React.useState(false);
  const debounceRef = React.useRef(null);
  // ถ้าผู้ใช้เลือกผู้รับผิดชอบ/หมวดเอง → Mabelz จะไม่ override ทับ (มี prefill ก็ถือว่าเลือกแล้ว)
  const userPickedAssignee = React.useRef(!!(prefill && prefill.assignee != null));
  const userPickedCategory = React.useRef(!!(prefill && prefill.category));
  const { t, lang } = useT();
  const { categories, openManage } = useCats();

  function set(k, v) { setForm(f => ({ ...f, [k]: v })); }

  // Auto-assign ทันทีที่ title หรือ description หรือ category เปลี่ยน (debounce 600ms)
  React.useEffect(() => {
    if (editing || selfOnly) return;   // selfOnly = ล็อกผู้รับผิดชอบเป็นตัวเอง ไม่ต้อง auto-assign
    if (!form.title.trim()) { setMabelzTip(null); return; }
    setThinking(true);
    clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => {
      const result = mabelzRecommend(form.title, form.description, form.category, tasks || [], lang);
      setMabelzTip(result);
      setForm(f => ({
        ...f,
        // auto-assign เฉพาะตอนมั่นใจ (มี keyword จับคู่) + ผู้ใช้ยังไม่เลือกเอง — ไม่งั้นปล่อยให้เลือกอิสระ
        assignee: (result.confident && !userPickedAssignee.current) ? result.recommended : f.assignee,
        category: (result.confident && !userPickedCategory.current && result.category) ? result.category : f.category,
      }));
      setThinking(false);
    }, 600);
    return () => clearTimeout(debounceRef.current);
  }, [form.title, form.description, form.category, lang]);

  function handleSave() {
    if (!form.title.trim())   { alert(t('alert_title')); return; }
    if (!form.deadline)       { alert(t('alert_deadline')); return; }
    if (!form.assignee)       { alert(t('alert_assignee')); return; }
    onSave(form);
  }

  // งานประจำ/ภาษีสรรพากร
  const taxRec = parseTaxRec(form.recurrence);
  const recSelectValue = taxRec ? ('tax:' + taxRec.form) : (form.recurrence || 'none');
  function onRecChange(val) {
    if (val.indexOf('tax:') === 0) {
      const fc = val.split(':')[1];
      const ef = taxRec ? taxRec.efile : false;
      setForm(f => ({ ...f, recurrence: 'tax:' + fc + ':' + (ef ? 'efile' : 'paper'), deadline: upcomingTaxDeadline(fc, ef, TODAY) }));
    } else {
      setForm(f => ({ ...f, recurrence: val }));
    }
  }
  function onEfileChange(checked) {
    if (!taxRec) return;
    setForm(f => ({ ...f, recurrence: 'tax:' + taxRec.form + ':' + (checked ? 'efile' : 'paper'), deadline: upcomingTaxDeadline(taxRec.form, checked, TODAY) }));
  }

  return (
    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-header">
          <div className="modal-title">{editing ? t('modal_edit') : t('modal_create')}</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          {limitedEdit && (
            <div style={{ display:'flex', alignItems:'center', gap:8, background:'rgba(99,102,241,0.10)', border:'1px solid var(--primary)', borderRadius:10, padding:'9px 12px', marginBottom:14, fontSize:'0.8rem', fontWeight:600, color:'var(--text)' }}>
              <span>✏️</span><span>{t('edit_limited_note')}</span>
            </div>
          )}
          <div className="form-group">
            <label className="form-label">{t('f_title')}</label>
            <input className="form-input" value={form.title} onChange={e => set('title', e.target.value)} placeholder={t('f_title_ph')} autoFocus={!limitedEdit} disabled={limitedEdit} />
          </div>
          <div className="form-group">
            <label className="form-label">{t('f_desc')}</label>
            <textarea className="form-textarea" value={form.description} onChange={e => set('description', e.target.value)} placeholder={t('f_desc_ph')} disabled={limitedEdit} />
          </div>

          {/* Mabelz Auto-assign Card */}
          {!editing && (
            <div style={{ marginBottom:14, borderRadius:12, border: (mabelzTip && mabelzTip.confident) ? '2px solid #bfdbfe' : '2px dashed #cbd5e1', background: (mabelzTip && mabelzTip.confident) ? '#eff6ff' : '#f8fafc', padding:'12px 14px', minHeight:64, display:'flex', alignItems:'center', gap:12 }}>
              {thinking ? (
                <div style={{ display:'flex', alignItems:'center', gap:10, color:'#64748b', fontSize:'0.88rem' }}>
                  <span style={{ fontSize:'1.2rem' }}>🤔</span>
                  <div><strong style={{ color:'#1e3a5f' }}>{t('mabelz_analyzing')}</strong><br/><span style={{ fontSize:'0.8rem' }}>{t('mabelz_finding')}</span></div>
                </div>
              ) : (mabelzTip && !mabelzTip.confident) ? (
                <div style={{ display:'flex', alignItems:'center', gap:10, color:'#64748b', fontSize:'0.86rem' }}>
                  <span style={{ fontSize:'1.2rem' }}>👩‍💼</span>
                  <span>{t('mabelz_pick_self')}</span>

              ) : mabelzTip ? (
                <div style={{ width:'100%' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:6 }}>
                    <div style={{ width:36, height:36, borderRadius:'50%', background: getUserColor(mabelzTip.recommended), display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontWeight:700, fontSize:'0.85rem', flexShrink:0 }}>
                      {initials(mabelzTip.recommended)}
                    </div>

                  <span style={{ fontSize:'1.2rem' }}>👩‍💼</span>
                  <span>{t('mabelz_hint')}</span>
                </div>
              )}
            </div>
          )}

          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">{t('f_assignee')}</label>
              {limitedEdit ? (
                <input className="form-input" value={form.assignee} disabled readOnly />
              ) : selfOnly ? (
                <input className="form-input" value={currentUser} disabled readOnly title={t('f_assignee_locked')} />

              </select>
              <div onClick={() => openManage()} style={{ fontSize:'0.74rem', color:'var(--primary)', cursor:'pointer', marginTop:6, fontWeight:600 }}>{t('cat_propose')}</div>

            <div className="form-group">
              <label className="form-label">{t('f_priority')}</label>
              <select className="form-select" value={form.priority} onChange={e => set('priority', e.target.value)} disabled={limitedEdit}>

// ─── SettingsModal (Phase 2: เชื่อม Google Sheet) ──────────────────────────────

function SettingsModal({ cfg, authed, onClose, onSave, onPushLocal, isManager, onBackup, onDownload, autoBackup, onToggleAutoBackup, lastBackup }) {
  const { t, lang } = useT();
  const [url, setUrl] = useState(cfg.url || '');
  const [key, setKey] = useState(cfg.key || '');
  const [testState, setTestState] = useState('');   // '' | testing | ok | fail
  const [pushState, setPushState] = useState('');   // '' | pushing | done | fail
  const [pushMsg,   setPushMsg]   = useState('');
  const [backupState, setBackupState] = useState('');  // '' | backing | done | fail
  const [backupMsg,   setBackupMsg]   = useState('');

  async function backupNow() {
    setBackupState('backing'); setBackupMsg('');
    try {
      const res = await onBackup();
      setBackupState('done'); setBackupMsg(t('backup_done', { name: (res && res.name) || '' }));
    } catch (e) {
      setBackupState('fail'); setBackupMsg(t('backup_fail') + (e && e.message ? ' (' + String(e.message).slice(0, 120) + ')' : ''));
    }
  }
  async function downloadNow() {
    setBackupState('backing'); setBackupMsg('');
    try {
      const res = await onDownload();
      setBackupState('done'); setBackupMsg(t('backup_downloaded', { name: (res && res.name) || '' }));
    } catch (e) {
      setBackupState('fail'); setBackupMsg(t('backup_fail') + (e && e.message ? ' (' + String(e.message).slice(0, 120) + ')' : ''));
    }
  }
  const fmtBackupTime = (iso) => { try { return new Date(iso).toLocaleString(lang === 'en' ? 'en-GB' : 'th-TH'); } catch (e) { return iso; } };

  const saved = url.trim() === (cfg.url || '') && key.trim() === (cfg.key || '');

  async function testConn() {
    if (!url.trim() || !key.trim()) { setTestState('fail'); return; }
    setTestState('testing');
    try {
      const c = makeSb({ url: url.trim(), key: key.trim() });
      if (!c) { setTestState('fail'); return; }
      const { error } = await c.from(SB_TABLE).select('id').limit(1);
      setTestState(!error ? 'ok' : 'fail');
    } catch (e) { setTestState('fail'); }
  }

  async function pushAll() {
    if (!saved || !cfg.url) { setPushState('fail'); setPushMsg(t('settings_save_first')); return; }
    if (!window.confirm(t('settings_push_confirm'))) return;
    setPushState('pushing'); setPushMsg('');
    try {
      const n = await onPushLocal();          // ใช้ไคลเอนต์ที่ล็อกอินแล้วจาก App
      setPushState('done'); setPushMsg(t('settings_push_done', { n }));
    } catch (e) { setPushState('fail'); setPushMsg(t('settings_push_fail')); }
  }

  return (
    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" style={{ maxWidth:540 }}>
        <div className="modal-header">
          <div className="modal-title">{t('settings_title')}</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <p style={{ fontSize:'0.82rem', color:'var(--text-muted)', marginBottom:16, lineHeight:1.6 }}>{t('settings_intro')}</p>

          <div className="form-group">
            <label className="form-label">{t('settings_url')}</label>
            <input className="form-input" value={url} onChange={e => { setUrl(e.target.value); setTestState(''); }} placeholder={t('settings_url_ph')} />
          </div>
          <div className="form-group">
            <label className="form-label">{t('settings_key')}</label>
            <input className="form-input" value={key} onChange={e => { setKey(e.target.value); setTestState(''); }} placeholder={t('settings_key_ph')} />
          </div>

              </div>
              <p style={{ fontSize:'0.72rem', color:'var(--warning)', marginTop:6 }}>{t('settings_push_warn')}</p>

          {/* สำรองข้อมูลขึ้น Google Drive — เฉพาะหัวหน้า */}
          {authed && isManager && (
            <>
              <div style={{ borderTop:'1px solid var(--border)', margin:'16px 0' }} />
              <div style={{ fontWeight:700, fontSize:'0.92rem', marginBottom:6 }}>💾 {t('backup_title')}</div>
              <p style={{ fontSize:'0.78rem', color:'var(--text-muted)', marginBottom:10, lineHeight:1.6 }}>{t('backup_intro')}</p>

                <button className="btn btn-primary" onClick={backupNow} disabled={backupState === 'backing'}>

                </button>
                <button className="btn btn-outline" onClick={downloadNow} disabled={backupState === 'backing'}>
                  ⬇️ {t('backup_download')}
                </button>
                {backupMsg && <span style={{ fontSize:'0.8rem', fontWeight:600, color: backupState === 'done' ? 'var(--success)' : 'var(--danger)' }}>{backupMsg}</span>}
              </div>
              <label style={{ display:'flex', alignItems:'center', gap:8, fontSize:'0.84rem', cursor:'pointer', marginBottom:6 }}>
                <input type="checkbox" checked={autoBackup} onChange={e => onToggleAutoBackup(e.target.checked)} style={{ width:16, height:16 }} />
                <span>{t('backup_auto')}</span>
              </label>
              {lastBackup && <div style={{ fontSize:'0.74rem', color:'var(--text-muted)' }}>{t('backup_last')}: {fmtBackupTime(lastBackup)}</div>}
            </>
          )}

          <div style={{ display:'flex', gap:10, justifyContent:'flex-end', alignItems:'center', marginTop:22 }}>
            {cfg.url && (
              <button className="btn btn-outline" style={{ marginRight:'auto', color:'var(--danger)' }} onClick={() => onSave({ url:'', key:'' })}>

            <button className="btn btn-primary" onClick={() => onSave({ url: url.trim(), key: key.trim() })}>{t('settings_save')}</button>

  );
}

// #4: นาฬิกา วันที่ + เวลา (อัปเดตทุกวินาที)
function TopbarClock() {
  const { lang } = useT();
  const [now, setNow] = useState(() => new Date());
  useEffect(() => { const id = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(id); }, []);
  const dowTH = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
  const dowEN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const pad = n => String(n).padStart(2, '0');
  const dow  = (lang === 'en' ? dowEN : dowTH)[now.getDay()];
  const mo   = (lang === 'en' ? MONTH_EN : MONTH_TH)[now.getMonth()];
  const yr   = lang === 'en' ? now.getFullYear() : now.getFullYear() + 543;
  const time = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  return (
    <div className="topbar-clock" title={dow + ' ' + now.getDate() + ' ' + mo + ' ' + yr}>
      <span className="topbar-clock-date">{dow} {now.getDate()} {mo} {yr}</span>
      <span className="topbar-clock-time">🕐 {time}</span>
    </div>
  );
}

function Topbar({ currentUser, darkMode, setDarkMode, isManager, viewLabel, search, onSearch, tasks, onToggleSidebar, onSelectTask, syncStatus, onOpenSettings, privacyMode, onTogglePrivacy, commentNotifs = [], onOpenCommentNotif, pendingCats = [], onOpenCategories, assignNotifs = [], onOpenAssignNotif }) {
  const { t, lang, setLang } = useT();
  const [notifOpen, setNotifOpen] = React.useState(false);
  const [notifPerm, setNotifPerm] = React.useState(('Notification' in window) ? Notification.permission : 'unsupported');
  function enableNotif() {
    if (!('Notification' in window)) return;
    Notification.requestPermission().then((p) => setNotifPerm(p)).catch(() => {});
  }

  const syncMeta = {
    local:   { dot:'#94a3b8', label: t('sync_local')   },
    online:  { dot:'#10b981', label: t('sync_online')  },
    offline: { dot:'#ef4444', label: t('sync_offline') },
    syncing: { dot:'#f59e0b', label: t('sync_syncing') },
  }[syncStatus] || { dot:'#94a3b8', label: t('sync_local') };

  // งานที่ใกล้ครบกำหนด/เกินกำหนด — เฉพาะงานที่ "ฉัน" รับผิดชอบเท่านั้น (ไม่เด้งงานคนอื่น แม้เป็นผู้จัดการ)
  const scope  = tasks.filter(t => t.assignee === currentUser);
  const alerts = scope
    .filter(x => x.status !== 'done' && daysDiff(x.deadline) <= 3)
    .map(x => ({ ...x, dd: daysDiff(x.deadline) }))
    .sort((a, b) => a.dd - b.dd);
  const catCount   = isManager ? pendingCats.length : 0;
  const totalNotif = alerts.length + commentNotifs.length + catCount + assignNotifs.length;

  function alertMeta(dd) {
    if (dd < 0)  return { cls: 'red',   text: t('overdue_days', { n: Math.abs(dd) }) };
    if (dd === 0) return { cls: 'red',   text: t('due_today') };
    if (dd === 1) return { cls: 'amber', text: t('due_tomorrow') };
    return { cls: 'blue', text: t('in_days', { n: dd }) };
  }

  return (
    <div className="topbar">
      <button className="topbar-hamburger" onClick={onToggleSidebar} title={t('menu')} aria-label={t('menu')}>☰</button>

      <div className="topbar-breadcrumb">
        <span>Accounting &amp; Finance</span>
        <span className="topbar-breadcrumb-sep">›</span>
        <span className="topbar-breadcrumb-current">{viewLabel}</span>
      </div>

      <div className="topbar-search">
        <span className="topbar-search-icon">🔍</span>
        <input
          placeholder={t('search_ph')}
          value={search}
          onChange={e => onSearch(e.target.value)}
        />
        {search && (
          <button className="topbar-search-clear" onClick={() => onSearch('')} title={t('clear')}>✕</button>
        )}
      </div>

      <div className="topbar-actions">
        {/* #4: นาฬิกาวันที่+เวลา */}
        <TopbarClock />

        {/* #2: โหมดส่วนตัว (เฉพาะหัวหน้า) — ซ่อนงานตัวเองตอนโชว์ลูกน้อง */}
        {isManager && (
          <button className={'topbar-privacy' + (privacyMode ? ' on' : '')} onClick={onTogglePrivacy} title={t('privacy_mode')}>
            <span>{privacyMode ? '🔒' : '🔓'}</span>
            <span className="privacy-label">{privacyMode ? t('privacy_on') : t('privacy_off')}</span>
          </button>
        )}

        {/* #2: หัวหน้าเห็นเฟือง (ตั้งค่า Supabase) — พนักงานเห็นแค่สถานะออนไลน์ */}
        {isManager ? (
          <div className="topbar-sync" onClick={onOpenSettings} title={t('settings')}>
            <span className="sync-dot" style={{ background: syncMeta.dot }} />
            <span className="sync-label">{syncMeta.label}</span>
            <span className="sync-gear">⚙️</span>
          </div>
        ) : (
          <div className="topbar-sync no-click">
            <span className="sync-dot" style={{ background: syncMeta.dot }} />
            <span className="sync-label">{syncMeta.label}</span>
          </div>
        )}

        {/* Language toggle TH / EN */}
        <div className="topbar-lang-toggle" onClick={() => setLang(lang === 'th' ? 'en' : 'th')} title="TH / EN">
          <span className={`lang-opt${lang === 'th' ? ' active' : ''}`}>TH</span>
          <span className="lang-sep">/</span>
          <span className={`lang-opt${lang === 'en' ? ' active' : ''}`}>EN</span>
        </div>

        {/* Dark mode toggle */}
        <div className="topbar-dark-toggle" onClick={() => setDarkMode(d => !d)}>
          <span>{darkMode ? '🌙' : '☀️'}</span>
          <div className={`toggle-switch${darkMode ? ' on' : ''}`}>
            <div className="toggle-knob" />
          </div>
          <span className="topbar-dark-label" style={{ fontSize:'0.75rem' }}>{t('dark_mode')}</span>
        </div>

        {/* Notification bell */}
        <div className="topbar-notif-wrap">
          <div className="topbar-notif" title={t('notif')} onClick={() => setNotifOpen(o => !o)}>
            🔔
            {totalNotif > 0 && <div className="notif-badge">{totalNotif > 9 ? '9+' : totalNotif}</div>}
          </div>
          {notifOpen && (
            <>
              <div className="notif-backdrop" onClick={() => setNotifOpen(false)} />
              <div className="notif-dropdown">
                <div className="notif-dropdown-header">
                  {t('notif')} {alerts.length > 0 && `(${alerts.length})`}
                </div>
                {notifPerm === 'default' && (
                  <div style={{ padding:'10px 12px', borderBottom:'1px solid var(--border)' }}>
                    <button className="btn btn-primary" style={{ width:'100%', fontSize:'0.78rem' }} onClick={enableNotif}>🔔 {t('notif_enable')}</button>
                  </div>
                )}
                {notifPerm === 'granted' && (
                  <div style={{ padding:'7px 12px', fontSize:'0.72rem', color:'var(--success)', borderBottom:'1px solid var(--border)' }}>✓ {t('notif_on')}</div>
                )}
                {notifPerm === 'denied' && (
                  <div style={{ padding:'7px 12px', fontSize:'0.72rem', color:'var(--text-muted)', borderBottom:'1px solid var(--border)' }}>{t('notif_blocked')}</div>
                )}
                {isManager && pendingCats.length > 0 && (
                  <div className="notif-list" style={{ borderBottom:'1px solid var(--border)' }}>
                    <div style={{ fontSize:'0.74rem', fontWeight:700, color:'var(--text-muted)', padding:'6px 10px 4px' }}>{t('cat_notif_section')}</div>
                    {pendingCats.map(pc => (
                      <div key={pc.id} className="notif-item" onClick={() => { onOpenCategories && onOpenCategories(); setNotifOpen(false); }}>
                        <div className="notif-dot-ind amber" />
                        <div style={{ minWidth:0, flex:1 }}>
                          <div className="notif-item-title">📁 <b>{pc.name}</b></div>
                          <div className="notif-item-meta">{t('cat_by', { name: pc.requested_by || '—' })}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                {commentNotifs.length > 0 && (
                  <div className="notif-list" style={{ borderBottom:'1px solid var(--border)' }}>
                    <div style={{ fontSize:'0.74rem', fontWeight:700, color:'var(--text-muted)', padding:'6px 10px 4px' }}>{t('cmt_notif_section')}</div>
                    {commentNotifs.map(cn => (
                      <div key={cn.id} className="notif-item" onClick={() => { onOpenCommentNotif(cn); setNotifOpen(false); }}>
                        <div className="notif-dot-ind blue" />
                        <div style={{ minWidth:0, flex:1 }}>
                          <div className="notif-item-title"><b>{cn.author}</b> {t('cmt_notif_commented')} · {cn.taskTitle}</div>
                          {cn.text && <div className="notif-item-meta">“{cn.text}”</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                {assignNotifs.length > 0 && (
                  <div className="notif-list" style={{ borderBottom:'1px solid var(--border)' }}>
                    <div style={{ fontSize:'0.74rem', fontWeight:700, color:'var(--text-muted)', padding:'6px 10px 4px' }}>{t('assign_notif_section')}</div>
                    {assignNotifs.map(an => (
                      <div key={an.id} className="notif-item" onClick={() => { onOpenAssignNotif(an); setNotifOpen(false); }}>
                        <div className="notif-dot-ind amber" />
                        <div style={{ minWidth:0, flex:1 }}>
                          <div className="notif-item-title">📌 <b>{an.by}</b> · {an.title}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                {alerts.length === 0 ? (
                  <div className="notif-empty">{t('no_upcoming')}</div>
                ) : (
                  <div className="notif-list">
                    {alerts.map(x => {
                      const m = alertMeta(x.dd);
                      return (
                        <div
                          key={x.id}
                          className="notif-item"
                          onClick={() => { onSelectTask(x); setNotifOpen(false); }}
                        >
                          <div className={`notif-dot-ind ${m.cls}`} />
                          <div style={{ minWidth: 0, flex: 1 }}>
                            <div className="notif-item-title">{x.title}</div>
                            <div className="notif-item-meta">
                              {m.text} • {formatDate(x.deadline, lang)}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </>
          )}
        </div>

        {/* User avatar */}
        <div
          className="topbar-avatar"
          style={{ background: getUserColor(currentUser) }}
          title={currentUser}
        >
          {initials(currentUser)}
        </div>
      </div>
    </div>
  );
}

// ─── DonutChart (Chart.js) ────────────────────────────────────────────────────

function DonutChart({ tasks }) {
  const { t, lang } = useT();
  const canvasRef = React.useRef(null);
  const chartRef  = React.useRef(null);

  const data = ASSIGNEES.map(name => ({
    name,
    count: tasks.filter(t => t.assignee === name && t.status !== 'done').length,
    color: getUserColor(name),
  })).filter(d => d.count > 0);

  const total = data.reduce((s, d) => s + d.count, 0);

  React.useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    if (chartRef.current) chartRef.current.destroy();

    chartRef.current = new Chart(canvasRef.current, {
      type: 'doughnut',
      data: {
        labels: data.map(d => d.name),
        datasets: [{
          data: data.map(d => d.count),
          backgroundColor: data.map(d => d.color),
          borderWidth: 2,
          borderColor: 'transparent',
          hoverOffset: 6,
        }],
      },
      options: {
        cutout: '72%',
        plugins: { legend: { display: false }, tooltip: {
          callbacks: { label: ctx => ` ${ctx.label}: ${ctx.raw} ${t('unit_tasks')}` }
        }},
        animation: { animateRotate: true, duration: 600 },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [tasks.length, JSON.stringify(data.map(d => d.count)), lang]);

  return (
    <div className="card" style={{ padding: '20px' }}>
      <div className="card-title">{t('chart_team_active')}</div>
      <div className="chart-wrap">
        <canvas ref={canvasRef} />
        <div className="donut-center">
          <div className="donut-center-value">{total}</div>
          <div className="donut-center-label">{t('chart_active_center')}</div>
        </div>
      </div>
      <div className="chart-legend">
        {data.map(d => (
          <div key={d.name} className="chart-legend-item">
            <div className="chart-legend-dot" style={{ background: d.color }} />
            <span className="chart-legend-name">{d.name}</span>
            <span className="chart-legend-val">{d.count}</span>
          </div>
        ))}
        {data.length === 0 && <div style={{ textAlign:'center', color:'var(--text-muted)', fontSize:'0.85rem', padding:'10px' }}>{t('chart_no_active')}</div>}
      </div>
    </div>
  );
}

// ─── BarChart (Chart.js) ──────────────────────────────────────────────────────

function StatusBarChart({ tasks }) {
  const { t, lang } = useT();
  const canvasRef = React.useRef(null);
  const chartRef  = React.useRef(null);

  const statuses = [
    { key: 'pending',     color: '#94a3b8' },
    { key: 'in_progress', color: '#6366f1' },
    { key: 'review',      color: '#d97706' },
    { key: 'done',        color: '#10b981' },
    { key: 'blocked',     color: '#ef4444' },
  ].map(s => ({ ...s, label: tStatusShort(s.key, lang) }));
  const counts = statuses.map(s => tasks.filter(t => t.status === s.key).length);

  React.useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    if (chartRef.current) chartRef.current.destroy();

    chartRef.current = new Chart(canvasRef.current, {
      type: 'bar',
      data: {
        labels: statuses.map(s => s.label),
        datasets: [{
          data: counts,
          backgroundColor: statuses.map(s => s.color + 'cc'),
          borderColor: statuses.map(s => s.color),
          borderWidth: 2,
          borderRadius: 8,
          borderSkipped: false,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: {
          callbacks: { label: ctx => ` ${ctx.raw} ${t('unit_tasks')}` }
        }},
        scales: {
          y: {
            beginAtZero: true,
            ticks: { stepSize: 1, color: '#94a3b8', font: { family: 'Sarabun' } },
            grid: { color: 'rgba(148,163,184,0.15)' },
          },
          x: {
            ticks: { color: '#94a3b8', font: { family: 'Sarabun', size: 11 } },
            grid: { display: false },
          },
        },
        animation: { duration: 600 },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [tasks.length, JSON.stringify(counts), lang]);

  return (
    <div className="card" style={{ padding: '20px' }}>
      <div className="card-title">{t('chart_by_status')}</div>
      <div className="chart-wrap" style={{ height: 200 }}>
        <canvas ref={canvasRef} />
      </div>
    </div>
  );
}

// ─── PersonalDonut (Chart.js) — สรุปงานของพนักงานรายคน ────────────────────────

function PersonalDonut({ tasks }) {
  const { t, lang } = useT();
  const canvasRef = React.useRef(null);
  const chartRef  = React.useRef(null);

  const segs = [
    { key: 'done',        color: '#10b981' },
    { key: 'review',      color: '#d97706' },
    { key: 'in_progress', color: '#6366f1' },
    { key: 'pending',     color: '#94a3b8' },
    { key: 'blocked',     color: '#ef4444' },
  ].map(s => ({ ...s, label: tStatusShort(s.key, lang), count: tasks.filter(t => t.status === s.key).length }))
   .filter(s => s.count > 0);

  const total = tasks.length;
  const done  = tasks.filter(t => t.status === 'done').length;
  const pct   = total > 0 ? Math.round((done / total) * 100) : 0;

  React.useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    if (chartRef.current) chartRef.current.destroy();

    chartRef.current = new Chart(canvasRef.current, {
      type: 'doughnut',
      data: {
        labels: segs.map(s => s.label),
        datasets: [{
          data: segs.map(s => s.count),
          backgroundColor: segs.map(s => s.color),
          borderWidth: 2,
          borderColor: 'transparent',
          hoverOffset: 6,
        }],
      },
      options: {
        cutout: '72%',
        plugins: { legend: { display: false }, tooltip: {
          callbacks: { label: ctx => ` ${ctx.label}: ${ctx.raw} ${t('unit_tasks')}` }
        }},
        animation: { animateRotate: true, duration: 600 },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [tasks.length, JSON.stringify(segs.map(s => s.count)), lang]);

  return (
    <div className="card" style={{ padding: '20px' }}>
      <div className="card-title">{t('chart_my_summary')}</div>
      <div className="chart-wrap">
        <canvas ref={canvasRef} />
        <div className="donut-center">
          <div className="donut-center-value">{pct}%</div>
          <div className="donut-center-label">{t('chart_done_center')}</div>
        </div>
      </div>
      <div className="chart-legend">
        {segs.map(s => (
          <div key={s.key} className="chart-legend-item">
            <div className="chart-legend-dot" style={{ background: s.color }} />
            <span className="chart-legend-name">{s.label}</span>
            <span className="chart-legend-val">{s.count}</span>
          </div>
        ))}
        {total === 0 && <div style={{ textAlign:'center', color:'var(--text-muted)', fontSize:'0.85rem', padding:'10px' }}>{t('no_tasks_yet')}</div>}
      </div>
    </div>
  );
}

}
const HEALTH = { good: '🟢', warn: '🟡', bad: '🔴', idle: '⚪' };
// เดือนที่งานสังกัด: งานเสร็จนับตามเดือนที่ทำเสร็จ, งานค้างนับตามเดือนกำหนดส่ง (ไม่มีกำหนด = เดือนปัจจุบัน)
function taskMonth(tk) {
  if (tk.status === 'done') {
    const cd = tk.completedAt || tk.updatedAt;
    if (cd) return cd.slice(0, 7);
  }
  return tk.deadline ? tk.deadline.slice(0, 7) : TODAY.slice(0, 7);
}
function monthLabel(mk, lang) {
  const [y, m] = mk.split('-').map(Number);
  return lang === 'en' ? `${MONTH_EN[m - 1]} ${y}` : `${MONTH_TH[m - 1]} ${y + 543}`;
}
function shiftMonth(mk, delta) {
  const [y, m] = mk.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
// คำนวณ KPI/ผลงานจากรายการงานที่ส่งเข้ามา (ใช้กับทั้งทีมและรายคน)
function calcPerf(list, weekStart, weekEnd) {
  const done   = list.filter(t => t.status === 'done');
  const active = list.filter(t => t.status !== 'done');
  const compDate = (t) => t.completedAt || t.updatedAt || null;           // วันที่เสร็จ (โดยประมาณ)
  const dated  = done.filter(t => compDate(t));
  const onTimeN = dated.filter(t => compDate(t).slice(0, 10) <= t.deadline).length;
  const total  = list.length;
  return {
    total, done: done.length, active: active.length,
    inProgress: list.filter(t => t.status === 'in_progress').length,
    pending:    list.filter(t => t.status === 'pending').length,
    review:     list.filter(t => t.status === 'review').length,
    blocked:    list.filter(t => t.status === 'blocked').length,
    overdue:    active.filter(t => daysDiff(t.deadline) < 0).length,
    dueSoon:    active.filter(t => { const d = daysDiff(t.deadline); return d >= 0 && d <= 3; }).length,
    compPct:    total ? Math.round(done.length / total * 100) : 0,
    onTimePct:  dated.length ? Math.round(onTimeN / dated.length * 100) : null,
    doneThisWeek: dated.filter(t => { const d = compDate(t).slice(0, 10); return d >= weekStart && d <= weekEnd; }).length,
    get health() {
      if (this.total === 0) return 'idle';
      if (this.overdue > 0) return 'bad';
      if (this.dueSoon > 0) return 'warn';
      return 'good';
    },
  };
}

  const [scope,    setScope]    = useState('month');   // 'month' | 'all'
  const [monthKey, setMonthKey] = useState(CUR_MONTH);
  const scopedTasks = React.useMemo(
    () => scope === 'all' ? tasks : tasks.filter(tk => taskMonth(tk) === monthKey),
    [tasks, scope, monthKey]
  );
  const myTasks   = isManager ? scopedTasks : scopedTasks.filter(t => t.assignee === currentUser);

  // สรุปงานที่ยังไม่เสร็จ แยกตามประเภท (รู้ว่าทีมกำลังเจองานประเภทไหนบ้าง)

    const m = {};
    myTasks.filter(tk => tk.status !== 'done').forEach(tk => { const c = tk.category || '—'; m[c] = (m[c] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);

  function isoDate(d) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }

        </div>
        <div className="stat-card green">

          <div className="stat-label">{t('stat_done')}</div>
          <div className="stat-value">{stats.done}</div>

        </div>
        <div className="stat-card red">

          <div className="stat-label">{t('stat_overdue')}</div>
          <div className="stat-value">{stats.overdue}</div>

                  </div>

                  <span style={{ fontWeight: 700 }}>{perf.done}/{perf.total} · {perf.compPct}%</span>
                </div>
                <div className="pbar"><span style={{ width: perf.compPct + '%', background: 'var(--success)' }} /></div>

                {/* workload */}
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.74rem', margin: '12px 0 4px' }}>
                  <span style={{ color: 'var(--text-muted)' }}>{t('perf_workload')}</span>
                  <span style={{ fontWeight: 700 }}>{perf.active} {t('unit_tasks')}</span>
                </div>
                <div className="pbar"><span style={{ width: Math.round(perf.active / maxActive * 100) + '%', background: user.color }} /></div>

                {/* chips */}
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 14 }}>
                  <span className="perf-chip">⚙️ {t('perf_inprogress')} {perf.inProgress}</span>
                  <span className="perf-chip">⏳ {t('perf_pending')} {perf.pending + perf.review}</span>
                  <span className="perf-chip">✅ {t('perf_done')} {perf.done}</span>
                  {perf.overdue > 0 && <span className="perf-chip" style={{ color: 'var(--danger)', borderColor: 'var(--danger)' }}>🔴 {t('perf_overdue')} {perf.overdue}</span>}
                  {perf.dueSoon > 0 && <span className="perf-chip" style={{ color: '#d97706', borderColor: 'var(--warning)' }}>🟡 {t('perf_duesoon')} {perf.dueSoon}</span>}
                </div>

                {perf.total === 0
                  ? <div style={{ marginTop: 12, fontSize: '0.73rem', color: 'var(--text-muted)' }}>{t('perf_no_tasks')}</div>
                  : perf.onTimePct != null && (
                    <div style={{ marginTop: 12, fontSize: '0.73rem', color: 'var(--text-muted)' }}>
                      {t('perf_ontime')}: <b style={{ color: 'var(--text)' }}>{perf.onTimePct}%</b> <span style={{ opacity: 0.7 }}>({t('perf_est')})</span>
                    </div>
                  )}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Week timeline */}
      <div className="card">
        <div className="card-title">{t('week_timeline')}</div>
        <div className="week-timeline">
          {weekDays.map((d, i) => {
            const ds      = isoDate(d);
            const isToday = ds === TODAY;
            const wTasks  = tasks.filter(t => t.deadline === ds && (isManager || t.assignee === currentUser));
            return (
              <div key={ds} className={`week-day${isToday ? ' today-col' : ''}`}>

                  </span>
                ))}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function TaskList({ tasks, currentUser, onSelectTask, onEditTask, onDeleteTask, onDuplicate, setCreateOpen, search, setSearch, mode }) {
  const { t, lang } = useT();
  const { categories } = useCats();
  const isManager = currentUser === 'Big Boss';
  const canEdit   = (task) => isManager || task.assignee === currentUser || task.createdBy === currentUser;

  const [myOnly,     setMyOnly]     = useState(mode !== 'completed' && !isManager);   // #2: เริ่มต้นเห็นงานตัวเอง
  const [fStatus,    setFStatus]    = useState('');
  const [fAssignees, setFAssignees] = useState([]);   // กรองรายคน — เลือกได้หลายคน (เจาะจง)
  const [fCat,       setFCat]       = useState('');
  const [fMonth,     setFMonth]     = useState('');   // กรองเดือน/ปี — '' = ทุกเดือน (YYYY-MM)
  const [asgOpen,    setAsgOpen]    = useState(false);   // เปิด/ปิด dropdown ติ๊กหลายคน

  // เดือนที่มีงานจริง — เรียงล่าสุดอยู่บน (ใช้ taskMonth เดียวกับ Dashboard: เสร็จแล้วนับเดือนที่เสร็จ, ค้างนับเดือนกำหนดส่ง)
  const monthsInView = useMemo(() => {
    return [...new Set(tasks.map(taskMonth))].sort((a, b) => b.localeCompare(a));
  }, [tasks]);

  const scoped = useMemo(() => myOnly ? tasks.filter(t => t.assignee === currentUser) : tasks, [tasks, myOnly, currentUser]);

  // รายชื่อคนที่ "เห็นได้" จากงานที่มีจริง (พนักงานจะไม่มี Big Boss เพราะถูกกรองออกตั้งแต่ visibleTasks)
  const peopleInView = useMemo(() => {
    const order = [...ASSIGNEES, 'Big Boss'];
    return [...new Set(tasks.map(t => t.assignee).filter(Boolean))]
      .sort((a, b) => (order.indexOf(a) < 0 ? 99 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 99 : order.indexOf(b)));
  }, [tasks]);
  const toggleAssignee = (name) => setFAssignees(s => s.includes(name) ? s.filter(n => n !== name) : [...s, name]);

  const filtered = useMemo(() => scoped.filter(t => {
    // #4: หน้า "งานทั้งหมด" ซ่อนงานเสร็จแล้ว เฉพาะตอนไม่ได้กรองสถานะ (พอกรองสถานะ = เห็นครบทุกสถานะ)
    if (mode !== 'completed' && !fStatus && t.status === 'done') return false;
    if (fStatus   && t.status   !== fStatus)    return false;
    if (fAssignees.length && !fAssignees.includes(t.assignee))  return false;
    if (fCat      && t.category !== fCat)       return false;
    if (fMonth    && taskMonth(t) !== fMonth)    return false;
    if (search    && !(
      t.title.toLowerCase().includes(search.toLowerCase()) ||
      (t.description || '').toLowerCase().includes(search.toLowerCase()) ||
      t.category.toLowerCase().includes(search.toLowerCase()) ||
      t.assignee.toLowerCase().includes(search.toLowerCase())
    )) return false;
    return true;
  }).sort((a, b) => {
    // เรียงตามวันครบกำหนด: ใกล้สุดอยู่บน → ไกลสุดอยู่ล่าง (งานไม่มีกำหนดส่งไปท้ายสุด)
    if (!a.deadline && !b.deadline) return 0;
    if (!a.deadline) return 1;
    if (!b.deadline) return -1;
    return a.deadline.localeCompare(b.deadline);
  }), [scoped, mode, fStatus, fAssignees, fCat, fMonth, search]);

  function clearFilters() { setFStatus(''); setFAssignees([]); setFCat(''); setFMonth(''); setSearch(''); }
  const hasFilter = fStatus || fAssignees.length || fCat || fMonth || search;
  const headerCount = mode === 'completed' ? scoped.length : scoped.filter(t => t.status !== 'done').length;

  return (
    <div>

          <div className="page-title">{mode === 'completed' ? t('completed_title') : t('tasklist_title')}</div>

        {mode !== 'completed' && (

                  onClick={() => setMyOnly(m => { const nv = !m; if (nv) setFAssignees([]); return nv; })}>

        <select className="filter-select" value={fStatus} onChange={e => setFStatus(e.target.value)}>

              style={{ cursor:'pointer', display:'inline-flex', alignItems:'center', gap:8, minWidth:160, justifyContent:'space-between' }}>
              <span style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                {fAssignees.length === 0 ? t('filter_all_assignee')
                  : fAssignees.length <= 2 ? fAssignees.join(', ')
                  : t('filter_people_n', { n: fAssignees.length })}
              </span>
              <span style={{ fontSize:'0.65rem', opacity:0.6, flexShrink:0 }}>▾</span>
            </button>
            {asgOpen && (
              <>
                <div onClick={() => setAsgOpen(false)} style={{ position:'fixed', inset:0, zIndex:40 }} />
                <div style={{ position:'absolute', top:'calc(100% + 5px)', left:0, zIndex:41, background:'var(--card)', border:'1px solid var(--border)', borderRadius:10, boxShadow:'0 10px 30px rgba(0,0,0,0.18)', padding:6, minWidth:200, maxHeight:300, overflowY:'auto' }}>
                  <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'4px 8px 6px' }}>
                    <span style={{ fontSize:'0.74rem', fontWeight:700, color:'var(--text-muted)' }}>{t('filter_people')}</span>
                    {fAssignees.length > 0 && (
                      <button type="button" onClick={() => setFAssignees([])}
                        style={{ fontSize:'0.72rem', color:'var(--primary)', background:'none', border:'none', cursor:'pointer', fontWeight:600 }}>

                  {peopleInView.map(name => {

                    return (

                        <input type="checkbox" checked={on} onChange={() => toggleAssignee(name)} style={{ accentColor: col, width:15, height:15, cursor:'pointer' }} />

        <select className="filter-select" value={fCat} onChange={e => setFCat(e.target.value)}>
          <option value="">{t('filter_all_cat')}</option>
          {[...new Set([...categories, ...tasks.map(tk => tk.category)].filter(Boolean))].map(c => <option key={c} value={c}>{tCat(c, lang)}</option>)}

// ─── TimelineView ─────────────────────────────────────────────────────────────

function TimelineView({ tasks, currentUser, onSelectTask }) {
  const { t, lang } = useT();
  const [year,  setYear]  = useState(() => Number(TODAY.slice(0, 4)));
  const [month, setMonth] = useState(() => Number(TODAY.slice(5, 7)) - 1); // 0-indexed เดือนปัจจุบัน

  function prevMonth() { if (month === 0) { setYear(y => y-1); setMonth(11); } else setMonth(m => m-1); }
  function nextMonth() { if (month === 11) { setYear(y => y+1); setMonth(0); } else setMonth(m => m+1); }

  const DAY_HEADERS = lang === 'en' ? ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'] : ['จ','อ','พ','พฤ','ศ','ส','อา'];

  const isManager    = currentUser === 'Big Boss';
  const visibleTasks = tasks;   // เห็นงานทั้งทีม (pill ระบายสีแยกคน + มี legend อยู่แล้ว)

  const firstDay  = new Date(year, month, 1);
  const lastDay   = new Date(year, month + 1, 0);
  const startDow  = firstDay.getDay(); // 0=Sun
  const offset    = startDow === 0 ? 6 : startDow - 1; // Mon start
  const totalCell = Math.ceil((offset + lastDay.getDate()) / 7) * 7;

  const cells = Array.from({ length: totalCell }, (_, i) => {
    const dn = i - offset + 1;
    if (dn < 1 || dn > lastDay.getDate()) return { dn: null, ds: null };
    const mm = String(month + 1).padStart(2, '0');
    const dd = String(dn).padStart(2, '0');
    return { dn, ds: `${year}-${mm}-${dd}` };
  });

  return (
    <div>
      <div className="page-header">
        <div className="page-title">{t('timeline_title')}</div>
        <div className="page-subtitle">{t('timeline_sub')}</div>
      </div>

      <div className="cal-header">
        <button className="cal-nav-btn" onClick={prevMonth}>{t('prev')}</button>
        <div className="cal-month-label">{lang === 'en' ? `${MONTH_EN[month]} ${year}` : `${MONTH_TH[month]} ${year + 543}`}</div>
        <button className="cal-nav-btn" onClick={nextMonth}>{t('next')}</button>
      </div>

      <div className="cal-grid-wrap">
        <div className="cal-day-headers">
          {DAY_HEADERS.map((h, idx) => <div key={h} className={'cal-day-header' + (idx >= 5 ? ' weekend-header' : '')}>{h}</div>)}
        </div>
        <div className="cal-days">
          {cells.map((cell, i) => {
            const isToday   = cell.ds === TODAY;
            const holiday   = cell.ds ? THAI_HOLIDAY_NAMES[cell.ds] : null;
            const dow       = cell.ds ? new Date(cell.ds + 'T00:00:00').getDay() : -1;
            const isWeekend = dow === 0 || dow === 6;   // อาทิตย์/เสาร์ — ออฟฟิศหยุด
            const dayTasks  = cell.ds ? visibleTasks.filter(t => t.deadline === cell.ds) : [];
            return (
              <div key={i} className={`cal-cell${!cell.dn ? ' other-month' : ''}${isToday ? ' today-cell' : ''}${holiday ? ' holiday-cell' : ''}${isWeekend && !holiday ? ' weekend-cell' : ''}`}>
                {cell.dn && (
                  <>
                    <div className="cal-date-num">{cell.dn}</div>
                    {holiday && <div className="cal-holiday" title={holiday}>🏖️ {holiday}</div>}
                    {dayTasks.map(t => (
                      <span
                        key={t.id}
                        className="cal-pill"
                        style={{ background: getUserColor(t.assignee) }}
                        title={`${t.title} — ${t.assignee}`}
                        onClick={() => onSelectTask(t)}
                      >
                        {t.title.length > 13 ? t.title.slice(0, 13) + '…' : t.title}
                      </span>
                    ))}
                  </>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Legend */}
      <div style={{ display:'flex', gap:16, marginTop:14, flexWrap:'wrap', alignItems:'center' }}>
        <span style={{ fontSize:'0.78rem', color:'var(--text-muted)', fontWeight:600 }}>{t('legend')}</span>
        {ASSIGNEES.map(a => (
          <div key={a} style={{ display:'flex', alignItems:'center', gap:6, fontSize:'0.82rem', color:'var(--text-muted)' }}>
            <span style={{ width:12, height:12, borderRadius:3, background:getUserColor(a), display:'inline-block' }} />
            {a}
          </div>
        ))}
        <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:'0.82rem', color:'var(--text-muted)' }}>
          <span style={{ width:12, height:12, borderRadius:3, background:'#eff6ff', border:'1.5px solid #bfdbfe', display:'inline-block' }} />
          {t('today')}
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:'0.82rem', color:'var(--text-muted)' }}>
          <span style={{ width:12, height:12, borderRadius:3, background:'rgba(239,68,68,0.15)', border:'1.5px solid var(--danger)', display:'inline-block' }} />
          🏖️ {t('legend_holiday')}
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:'0.82rem', color:'var(--text-muted)' }}>
          <span style={{ width:12, height:12, borderRadius:3, background:'rgba(148,163,184,0.2)', display:'inline-block' }} />
          {t('legend_weekend')}
        </div>
      </div>
    </div>
  );
}

// ─── ReportView ───────────────────────────────────────────────────────────────

function ReportView({ tasks, currentUser, onSelectTask, showManager }) {
  const { t, lang } = useT();
  const people = (showManager ? ['Big Boss'].concat(ASSIGNEES) : ASSIGNEES).map(name => {
    const u     = USERS.find(x => x.name === name);
    const mine  = tasks.filter(x => x.assignee === name);
    const done  = mine.filter(x => x.status === 'done').length;
    const inp   = mine.filter(x => x.status === 'in_progress').length;
    const rev   = mine.filter(x => x.status === 'review').length;
    const pend  = mine.filter(x => x.status === 'pending').length;
    const blk   = mine.filter(x => x.status === 'blocked').length;
    const pct   = mine.length > 0 ? Math.round((done / mine.length) * 100) : 0;
    return { name, role: u?.role || '', ai: u?.ai || '', training: !!u?.training, total: mine.length, done, inp, rev, pend, blk, pct };
  });

  const todayObj   = new Date(TODAY + 'T00:00:00');
  const monthLabel = lang === 'en'
    ? `${MONTH_EN[todayObj.getMonth()]} ${todayObj.getFullYear()}`
    : `${MONTH_TH[todayObj.getMonth()]} ${todayObj.getFullYear() + 543}`;

  function exportCSV() {
    const header = [t('th_title'), t('th_assignee'), t('th_category'), t('th_status'), t('th_priority'), t('th_deadline'), t('f_desc')];
    const esc = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    const rows = tasks.map(x => [
      x.title, x.assignee, tCat(x.category, lang),
      tStatus(x.status, lang),
      tPriority(x.priority, lang),
      x.deadline, x.description || '',
    ].map(esc).join(','));
    const csv  = '﻿' + [header.map(esc).join(','), ...rows].join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `${lang === 'en' ? 'task-report' : 'รายงานงาน'}-${TODAY}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return (
    <div>
      <div className="page-header" style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:12, flexWrap:'wrap' }}>
        <div>
          <div className="page-title">{t('report_title')}</div>
          <div className="page-subtitle">{t('report_sub', { month: monthLabel })}</div>
        </div>
        <button className="btn btn-primary" style={{ marginTop:4 }} onClick={exportCSV}>{t('export_csv')}</button>
      </div>

      <div className="report-grid">
        {people.map(p => (
          <div key={p.name} className="report-card">
            <div className="report-person-header">
              <Avatar name={p.name} size="lg" />
              <div style={{ minWidth:0 }}>
                <div className="report-name">
                  {p.name}
                  {p.training && <span style={{ marginLeft:6, fontSize:'0.62rem', fontWeight:700, color:'#d97706', background:'#fffbeb', border:'1px solid #fde68a', borderRadius:6, padding:'1px 6px', verticalAlign:'middle' }}>🎓 {t('training')}</span>}
                </div>
                <div className="report-role">{tRole(p.role, lang)}</div>
                {p.ai && <div style={{ fontSize:'0.72rem', color:'var(--text-muted)', marginTop:2 }}>🤖 {t('assistant')}: <b style={{ color:'var(--text)' }}>{p.ai}</b></div>}
              </div>
              <div style={{ marginLeft:'auto', textAlign:'right' }}>
                <div style={{ fontSize:'1.6rem', fontWeight:700, color:'var(--text)', lineHeight:1 }}>{p.pct}%</div>
                <div style={{ fontSize:'0.72rem', color:'var(--text-muted)' }}>{t('chart_done_center')}</div>
              </div>
            </div>
            <div style={{ display:'flex', justifyContent:'space-between', fontSize:'0.78rem', color:'var(--text-muted)', marginBottom:2 }}>
              <span>{t('progress')}</span>
              <span>{p.done}/{p.total} {t('tasks_word')}</span>
            </div>
            <div className="progress-bar-wrap">
              <div className="progress-bar-fill" style={{ width:`${p.pct}%` }} />
            </div>
            <div className="report-badges">
              <span className="report-badge" style={{ background:'#f1f5f9', color:'#64748b' }}>{t('rb_all', { n: p.total })}</span>
              <span className="report-badge" style={{ background:'#ecfdf5', color:'#10b981' }}>{t('rb_done', { n: p.done })}</span>
              <span className="report-badge" style={{ background:'#eff6ff', color:'#2563eb' }}>{t('rb_inprogress', { n: p.inp })}</span>
              {p.rev > 0 && <span className="report-badge" style={{ background:'#fff7ed', color:'#d97706' }}>{t('rb_review', { n: p.rev })}</span>}
              <span className="report-badge" style={{ background:'#fffbeb', color:'#d97706' }}>{t('rb_pending', { n: p.pend })}</span>

                <th>{t('th_category')}</th>

                <tr key={task.id} className={rowClass(task.deadline, task.status)} onClick={() => onSelectTask(task)} style={{ cursor:'pointer', borderLeft: '4px solid ' + getUserColor(task.assignee) }}>

          </table>
        </div>
      </div>
    </div>
  );

// ─── Login screen (Phase 3 — Supabase email + password) ────────────────────────

function LoginScreen({ cfg, onOpenSettings }) {
  const { t, lang, setLang } = useT();
  const [email,    setEmail]    = useState('');
  const [password, setPassword] = useState('');
  const [busy,     setBusy]     = useState(false);
  const [err,      setErr]      = useState('');
  const [mode,     setMode]     = useState('signin');   // 'signin' | 'reset'
  const [info,     setInfo]     = useState('');         // ข้อความแจ้งผล (เช่น ส่งลิงก์แล้ว)

  async function doReset(e) {
    if (e) e.preventDefault();
    setErr(''); setInfo('');
    if (!email.trim()) { setErr(t('reset_email_required')); return; }
    setBusy(true);
    try {
      const redirectTo = window.location.origin + window.location.pathname;
      await sb.sendReset(cfg, email.trim(), redirectTo);
      setInfo(t('reset_sent'));
    } catch (e2) { setErr(t('reset_fail')); }
    setBusy(false);
  }

  async function submit(e) {
    if (e) e.preventDefault();
    if (!email.trim() || !password) { setErr(t('login_error')); return; }
    const c = getSb(cfg);

        <div className="welcome-logo"><img src={COMPANY_LOGO} alt="Hungry Hub" className="welcome-logo-img" /></div>
        <div className="welcome-title">Accounting &amp; Finance</div>
        <div style={{ fontSize:'0.95rem', color:'#64748b', marginTop:4, marginBottom:2 }}>Hungry Hub</div>
        <div className="welcome-sub">{t('login_sub')}</div>

        {mode === 'signin' ? (
        <form onSubmit={submit} style={{ marginTop:18, textAlign:'left' }}>
          <div className="form-group">
            <label className="form-label">{t('login_email')}</label>
            <input className="form-input" type="email" autoComplete="username" value={email}
                   onChange={e => { setEmail(e.target.value); setErr(''); }} placeholder={t('login_email_ph')} />
          </div>
          <div className="form-group">
            <label className="form-label">{t('login_password')}</label>
            <input className="form-input" type="password" autoComplete="current-password" value={password}
                   onChange={e => { setPassword(e.target.value); setErr(''); }} placeholder={t('login_password_ph')} />
          </div>
          {err && <div style={{ color:'var(--danger)', fontSize:'0.82rem', fontWeight:600, marginBottom:10 }}>✕ {err}</div>}
          <button className="welcome-btn" type="submit" disabled={busy} style={{ width:'100%' }}>

          <div style={{ marginTop:12, fontSize:'0.8rem', color:'#6366f1', cursor:'pointer', textAlign:'center', fontWeight:600 }}

        ) : (
        <form onSubmit={doReset} style={{ marginTop:18, textAlign:'left' }}>
          <div className="welcome-sub" style={{ marginBottom:12 }}>{t('reset_desc')}</div>
          <div className="form-group">
            <label className="form-label">{t('login_email')}</label>
            <input className="form-input" type="email" autoComplete="username" value={email}
                   onChange={e => { setEmail(e.target.value); setErr(''); setInfo(''); }} placeholder={t('login_email_ph')} />
          </div>
          {err  && <div style={{ color:'var(--danger)',  fontSize:'0.82rem', fontWeight:600, marginBottom:10 }}>✕ {err}</div>}
          {info && <div style={{ color:'var(--success)', fontSize:'0.82rem', fontWeight:600, marginBottom:10 }}>{info}</div>}
          <button className="welcome-btn" type="submit" disabled={busy} style={{ width:'100%' }}>
            {busy ? t('reset_sending') : t('reset_send')}
          </button>
          <div style={{ marginTop:12, fontSize:'0.8rem', color:'var(--text-muted)', cursor:'pointer', textAlign:'center' }}
               onClick={() => { setMode('signin'); setErr(''); setInfo(''); }}>
            {t('reset_back')}
          </div>
        </form>
        )}

        <div style={{ marginTop:14, fontSize:'0.78rem', color:'var(--text-muted)', cursor:'pointer' }} onClick={onOpenSettings}>
          ⚙️ {t('settings')}
        </div>

    </div>
  );
}

// D2: ตรวจว่าข้อความเป็นคำสั่ง "ค้นหาไฟล์ใน Drive" ไหม → คืนคำค้น (ถ้าใช่)
function cleanDriveQ(x) {
  let q = (x || '').trim()
    .replace(/\s*(ให้(หน่อย|ที|ด้วย)?|หน่อย(ครับ|ค่ะ)?|ที|ด้วย|ครับ|ค่ะ|คะ)\s*$/g, '')
    .replace(/\s*ใน\s*(?:ไดร์ฟ|ไดรฟ์|ไดร์ว|ไดร์|ไดรว์|ไดร|drive).*$/i, '')
    .replace(/^(ชื่อ|ไฟล์ชื่อ|ไฟล์)\s*/, '')
    .trim();
  return q.length >= 2 ? q : null;
}
function detectDriveSearch(text) {
  let s = (text || '').trim().replace(/[?？！.]+$/, '').trim();
  if (!s) return null;
  let m;
  // นำหน้า: (ช่วย)(ค้นหา|ค้น|หา)(ไฟล์|เอกสาร) X
  m = s.match(/^(?:ช่วย\s*)?(?:ค้นหา|ค้น|หา)\s*(?:ไฟล์|เอกสาร)\s+(.+)$/i);
  if (m) return cleanDriveQ(m[1]);
  // หาใน(ไดรฟ์/drive) X
  m = s.match(/^(?:ช่วย\s*)?(?:ค้นหา|ค้น|หา)\s*(?:ใน)?\s*(?:ไดร์ฟ|ไดรฟ์|ไดร์ว|ไดร์|ไดรว์|ไดร|drive)\s+(.+)$/i);
  if (m) return cleanDriveQ(m[1]);
  // ลงท้าย: X อยู่ไหน / X อยู่โฟลเดอร์ไหน
  m = s.match(/^(?:ไฟล์|เอกสาร)?\s*(.+?)\s*อยู่(?:ที่ไหน|โฟลเดอร์ไหน|ตรงไหน|ไหน)$/i);
  if (m) return cleanDriveQ(m[1]);
  // English: find/search file|document X ; find X in drive
  m = s.match(/^(?:find|search)\s+(?:for\s+)?(?:a\s+|the\s+)?(?:file|document|doc)\s+(?:named\s+|called\s+)?(.+)$/i);
  if (m) return cleanDriveQ(m[1]);
  m = s.match(/^(?:find|search)\s+(.+?)\s+in\s+(?:the\s+)?drive$/i);
  if (m) return cleanDriveQ(m[1]);
  m = s.match(/^where(?:'s| is| are)\s+(?:the\s+)?(?:file\s+)?(.+)$/i);
  if (m) return cleanDriveQ(m[1]);
  // กว้างขึ้น: "หา X / ค้น X / ค้นหา X" (ไม่มีคำว่าไฟล์ก็ได้) — เว้นพวกคำถามเชิงอธิบาย
  const NON_FILE = /(วิธี|ยังไง|อย่างไร|ทำไม|เท่าไหร่|เท่าไร|กี่|อะไร|คือ|แปลว่า|หมายถึง|ไหม|หรือไม่|ขั้นตอน|สูตร|ข้อมูล|ความหมาย|how|why|what|when|explain)/i;
  m = s.match(/^(?:ช่วย\s*)?(?:ค้นหา|ค้น|หา)\s*(.+)$/i);
  if (m && !NON_FILE.test(m[1])) return cleanDriveQ(m[1]);
  return null;
}
// ─── Phase 4: AI Assistant chat widget ────────────────────────────────────────
function ChatWidget({ sbCfg, currentUser, tasks, isManager, ready }) {
  const { t, lang } = useT();
  const me    = USERS.find(u => u.name === currentUser);
  const buddy = (me && me.ai) || 'AI';
  const role  = me ? tRole(me.role, lang) : '';
  const [open,  setOpen]  = useState(false);
  const [input, setInput] = useState('');
  const [msgs,  setMsgs]  = useState([]);   // { role:'user'|'assistant', content, engine?, file? }
  const [busy,  setBusy]  = useState(false);
  const [attachedFile, setAttachedFile] = useState(null);  // { name, kind, mime, data, sizeKB }
  const [loaded, setLoaded] = useState(false);             // โหลดประวัติแล้วหรือยัง
  const bodyRef = React.useRef(null);
  const fileRef = React.useRef(null);
  const inputRef = React.useRef(null);

  // เปิดแชท AI → แจ้งให้แชททีมปิด (กันหน้าต่างทับกัน)
  function openPanel() { setOpen(true); window.dispatchEvent(new CustomEvent('afflow-panel-open', { detail: 'ai' })); }
  useEffect(() => {
    const h = (e) => { if (e.detail !== 'ai') setOpen(false); };
    window.addEventListener('afflow-panel-open', h);
    return () => window.removeEventListener('afflow-panel-open', h);
  }, []);

  useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [msgs, busy, open]);

  // โหลดประวัติแชทของคน ๆ นี้ (ครั้งเดียวเมื่อพร้อม) — เก็บ 30 วันใน Supabase
  useEffect(() => {
    if (!ready || loaded) return;
    let alive = true;
    sb.loadChatHistory(sbCfg)
      .then(h => { if (alive && h && h.length) setMsgs(h); })
      .catch(() => {})
      .finally(() => { if (alive) setLoaded(true); });
    return () => { alive = false; };
  }, [ready]);

  const quicks = [t('chat_q1'), t('chat_q2'), t('chat_q3'), t('chat_q4')];

  function pickFile() { if (fileRef.current) fileRef.current.click(); }
  async function onFile(e) {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { setMsgs(m => [...m, { role:'assistant', content: t('chat_file_too_big') }]); return; }
    const mime = f.type || '';
    const ext  = (f.name.split('.').pop() || '').toLowerCase();
    const isImg = mime.startsWith('image/') || ['png','jpg','jpeg','webp','gif'].includes(ext);
    const isPdf = mime === 'application/pdf' || ext === 'pdf';
    try {
      if (isImg || isPdf) {
        const data = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(String(r.result).split(',')[1] || '');   // base64 (ตัด data: prefix)
          r.onerror = rej; r.readAsDataURL(f);
        });
        setAttachedFile({ name: f.name, kind: isImg ? 'image' : 'pdf',
          mime: mime || (isPdf ? 'application/pdf' : 'image/png'), data, sizeKB: Math.round(f.size/1024) });
      } else {
        const data = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(String(r.result || '').slice(0, 50000));
          r.onerror = rej; r.readAsText(f);
        });
        setAttachedFile({ name: f.name, kind: 'text', mime: mime || 'text/plain', data, sizeKB: Math.round(f.size/1024) });
      }
    } catch (e2) { setMsgs(m => [...m, { role:'assistant', content: t('chat_error') }]); }
  }

  // D2: ค้นหาไฟล์ใน Drive แล้วแสดงผลในแชท (ใช้ทั้งจากการพิมพ์คำสั่ง และปุ่ม 🔍)
  async function doDriveSearch(driveQ, userMsg) {
    setMsgs(m => [...m, userMsg]);
    setBusy(true);
    try {
      const res = await sb.driveSearch(sbCfg, driveQ);
      let content, drive = null;
      if (res && res.error) {
        content = t('chat_drive_err') + (res.detail || res.message ? ' (' + (res.detail || res.message) + ')' : '');
      } else if (res && res.results === undefined && res.files !== undefined) {
        content = t('chat_drive_oldfn');   // Edge Function ยังเป็นโค้ดเก่า (list-only) ยังไม่มีโหมดค้นหา
      } else {
        const results = (res && res.results) || [];
        if (!results.length) content = t('chat_drive_none', { q: driveQ });
        else { content = t('chat_drive_found', { n: results.length, q: driveQ }); drive = results; }
      }
      setMsgs(m => [...m, { role:'assistant', content, drive }]);
      const histText = content + (drive ? '\n' + drive.map(r => '• ' + r.name + (r.path ? ' — 📁 ' + r.path : '')).join('\n') : '');
      sb.saveChatMessages(sbCfg, [{ role:'user', content: userMsg.content }, { role:'assistant', content: histText }]).catch(() => {});
    } catch (e) {
      setMsgs(m => [...m, { role:'assistant', content: t('chat_drive_err') }]);
    } finally { setBusy(false); }
  }
  // ปุ่ม 🔍 — ค้นข้อความในช่องพิมพ์ใน Drive ทันที (ไม่ต้องมีคำว่า "หาไฟล์")
  function searchDriveBtn() {
    if (busy) return;
    const qq = input.trim();
    if (!qq) { if (inputRef.current) inputRef.current.focus(); return; }   // ยังไม่พิมพ์ → เด้งไปช่องพิมพ์
    setInput('');
    const userMsg = { role:'user', content: qq };
    if (!ready) { setMsgs(m => [...m, userMsg, { role:'assistant', content: t('chat_not_ready') }]); return; }
    doDriveSearch(qq, userMsg);
  }

  async function send(text) {
    const q = (text != null ? text : input).trim();
    const fileToSend = (text == null) ? attachedFile : null;   // chip ด่วนไม่แนบไฟล์
    if ((!q && !fileToSend) || busy) return;
    setInput(''); if (fileToSend) setAttachedFile(null);
    const userMsg = { role:'user', content: q || (lang === 'en' ? '(file attached)' : '(แนบไฟล์)'),
                      file: fileToSend ? fileToSend.name : null };
    if (!ready) {
      setMsgs(m => [...m, userMsg, { role:'assistant', content:t('chat_not_ready') }]);
      return;
    }
    // ── D2: AI ค้นหา Drive — ถ้าข้อความเป็นคำสั่งค้นไฟล์ → ค้นใน Drive แทนการถาม AI ──
    const driveQ = (!fileToSend) ? detectDriveSearch(q) : null;
    if (driveQ) { await doDriveSearch(driveQ, userMsg); return; }
    const next = [...msgs, userMsg];
    setMsgs(next);
    setBusy(true);
    try {
      const payload = {
        messages: next.map(m => ({ role:m.role, content:m.content })),
        persona: { buddy, name: currentUser, role },
        context: buildChatContext(tasks, currentUser, isManager),
        lang,
      };
      if (fileToSend) payload.file = { name: fileToSend.name, kind: fileToSend.kind, mime: fileToSend.mime, data: fileToSend.data };
      const data = await sb.aiChat(sbCfg, payload);
      let reply;
      if (data && data.reply) reply = data.reply;
      else if (data && data.error) reply = t('chat_error')
        + (data.detail ? ('\n\n⚠️ [' + (data.engine || 'AI') + ' ' + (data.status || '') + '] ' + String(data.detail).slice(0, 300))
                       : ('\n\n⚠️ ' + data.error));
      else reply = t('chat_error');
      const eng = data && data.engine;
      setMsgs(m => [...m, { role:'assistant', content: reply, engine: eng }]);
      // บันทึกลง Supabase (เก็บ 30 วัน) — เงียบ ๆ ไม่ขัดจังหวะผู้ใช้
      sb.saveChatMessages(sbCfg, [
        { role:'user', content: userMsg.content },
        { role:'assistant', content: reply, engine: eng },
      ]).catch(() => {});
    } catch (e) {
      setMsgs(m => [...m, { role:'assistant', content: t('chat_error') }]);
    } finally {
      setBusy(false);
    }
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  if (!open) {
    return (
      <button className="chat-fab" onClick={openPanel} title={t('chat_open')}>
        <AiAvatar name={buddy} size={26} ring={false} /> {buddy}
      </button>
    );
  }

  return (
    <div className="chat-panel">
      <div className="chat-head">
